spring.application.name=ekart

spring.datasource.url=jdbc:mysql://localhost:3306/ekart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080

# Copy this file to application.properties and set your key
ekart.ai.api-key=YOUR_XAI_GROK_API_KEY
ekart.ai.base-url=https://api.x.ai/v1
ekart.ai.model=grok-3-mini
